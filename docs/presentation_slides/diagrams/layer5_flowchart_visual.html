<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loan-IQ 5-Layer Architecture Flowchart</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background-color: #0000FF;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    background-color: #0000FF;
    padding: 20px;
  }
  svg {
    background-color: #0000FF;
  }
</style>
</head>
<body>
<div class="container">
<svg width="1500" height="850" viewBox="0 0 1500 850" xmlns="http://www.w3.org/2000/svg">

  <!-- Royal Blue Background -->
  <rect width="1500" height="850" fill="#0000FF"/>

  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000"/>
    </marker>
  </defs>

  <!-- CSS Styles inside SVG -->
  <style>
    .title-badge { fill: #FFFFFF; stroke: #000000; stroke-width: 1.5; rx: 4; ry: 4; }
    .badge-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .box { fill: #FFFFFF; stroke: #000000; stroke-width: 1.5; }
    .box-text { font-family: Arial, sans-serif; font-size: 11px; fill: #000000; text-anchor: middle; }
    .box-text-bold { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .line { stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
    .line-no-arrow { stroke: #000000; stroke-width: 1.5; }
  </style>

  <!-- ==================== COLUMN 1: LAYER 1 ==================== -->
  <g transform="translate(30, 30)">
    <!-- Header Badge -->
    <rect class="title-badge" x="0" y="0" width="240" height="35"/>
    <text class="badge-text" x="120" y="22">Layer 1: Customer Input Layer</text>

    <!-- Parallelogram 1 -->
    <polygon class="box" points="20,60 220,60 200,120 0,120"/>
    <text class="box-text" x="110" y="85">Customer Loan</text>
    <text class="box-text" x="110" y="100">Application</text>

    <!-- Arrow 1 -->
    <line class="line" x1="110" y1="120" x2="110" y2="150"/>

    <!-- Process Box 1 -->
    <rect class="box" x="10" y="150" width="200" height="50"/>
    <text class="box-text" x="110" y="172">Collect Customer</text>
    <text class="box-text" x="110" y="187">Details</text>

    <!-- Arrow 2 -->
    <line class="line" x1="110" y1="200" x2="110" y2="230"/>

    <!-- Parallelogram 2 (OUTPUT) -->
    <polygon class="box" points="20,230 220,230 200,290 0,290"/>
    <text class="box-text-bold" x="110" y="255">OUTPUT: Raw</text>
    <text class="box-text-bold" x="110" y="270">Financial Data</text>

    <!-- Connector to Column 2 -->
    <path class="line" d="M 200 260 L 270 260 L 270 95 L 300 95"/>
  </g>

  <!-- ==================== COLUMN 2: LAYER 2 ==================== -->
  <g transform="translate(300, 30)">
    <!-- Header Badge -->
    <rect class="title-badge" x="0" y="0" width="250" height="35"/>
    <text class="badge-text" x="125" y="22">Layer 2: Preprocessing &amp; Security Layer</text>

    <!-- Process Box 1 -->
    <rect class="box" x="25" y="65" width="200" height="40"/>
    <text class="box-text" x="125" y="90">Handle Missing Values</text>

    <!-- Arrow 1 -->
    <line class="line" x1="125" y1="105" x2="125" y2="135"/>

    <!-- Process Box 2 -->
    <rect class="box" x="25" y="135" width="200" height="40"/>
    <text class="box-text" x="125" y="160">OneHotEncoder</text>

    <!-- Arrow 2 -->
    <line class="line" x1="125" y1="175" x2="125" y2="205"/>

    <!-- Process Box 3 -->
    <rect class="box" x="25" y="205" width="200" height="40"/>
    <text class="box-text" x="125" y="230">SMOTE</text>

    <!-- Arrow 3 -->
    <line class="line" x1="125" y1="245" x2="125" y2="275"/>

    <!-- Diamond 1 -->
    <polygon class="box" points="125,275 185,315 125,355 65,315"/>
    <text class="box-text" x="125" y="310">Anomaly</text>
    <text class="box-text" x="125" y="325">Detected?</text>

    <!-- Diamond 1 Yes Side Box -->
    <line class="line" x1="185" y1="315" x2="215" y2="315"/>
    <text class="box-text" x="197" y="310">Yes</text>
    <rect class="box" x="215" y="295" width="60" height="40"/>
    <text class="box-text" x="245" y="312">Flag</text>
    <text class="box-text" x="245" y="325">Suspicious</text>

    <!-- Arrow Diamond 1 to Diamond 2 -->
    <line class="line" x1="125" y1="355" x2="125" y2="395"/>
    <text class="box-text" x="135" y="375">No</text>

    <!-- Diamond 2 -->
    <polygon class="box" points="125,395 185,435 125,475 65,435"/>
    <text class="box-text" x="125" y="430">Violates</text>
    <text class="box-text" x="125" y="445">RBI Rules?</text>

    <!-- Diamond 2 Yes Side Box -->
    <line class="line" x1="185" y1="435" x2="215" y2="435"/>
    <text class="box-text" x="197" y="430">Yes</text>
    <rect class="box" x="215" y="415" width="65" height="40"/>
    <text class="box-text" x="247" y="432">Reject</text>
    <text class="box-text" x="247" y="445">Application</text>

    <!-- Arrow Diamond 2 to Output -->
    <line class="line" x1="125" y1="475" x2="125" y2="515"/>
    <text class="box-text" x="135" y="495">No</text>

    <!-- Parallelogram OUTPUT -->
    <polygon class="box" points="25,515 245,515 225,585 5,585"/>
    <text class="box-text-bold" x="125" y="542">OUTPUT: Clean Feature</text>
    <text class="box-text-bold" x="125" y="557">Vector &amp; Security Flag</text>

    <!-- Connector to Column 3 -->
    <path class="line" d="M 225 550 L 285 550 L 285 95 L 300 95"/>
  </g>

  <!-- ==================== COLUMN 3: LAYER 3 ==================== -->
  <g transform="translate(580, 30)">
    <!-- Header Badge -->
    <rect class="title-badge" x="0" y="0" width="260" height="35"/>
    <text class="badge-text" x="130" y="22">Layer 3: Machine Learning Risk Analysis &amp; Explainability</text>

    <!-- Top Parallelogram -->
    <polygon class="box" points="20,65 240,65 220,125 0,125"/>
    <text class="box-text" x="120" y="90">Clean Feature</text>
    <text class="box-text" x="120" y="105">Vector</text>

    <!-- Arrow 1 -->
    <line class="line" x1="120" y1="125" x2="120" y2="155"/>

    <!-- Process Box 1 -->
    <rect class="box" x="20" y="155" width="200" height="40"/>
    <text class="box-text" x="120" y="180">RiskAgent</text>

    <!-- Arrow 2 -->
    <line class="line" x1="120" y1="195" x2="120" y2="225"/>

    <!-- Process Box 2 -->
    <rect class="box" x="10" y="225" width="220" height="60"/>
    <text class="box-text" x="120" y="245">Meta-Learner Stacking Ensemble</text>
    <text class="box-text" x="120" y="260">Loan Prediction Model</text>
    <text class="box-text" x="120" y="273">ANN Meta-Learner</text>

    <!-- Arrow 3 -->
    <line class="line" x1="120" y1="285" x2="120" y2="315"/>

    <!-- Process Box 3 -->
    <rect class="box" x="20" y="315" width="200" height="45"/>
    <text class="box-text" x="120" y="335">Predict Loan Risk</text>
    <text class="box-text" x="120" y="350">SHAP Explainer Tool</text>

    <!-- Arrow 4 -->
    <line class="line" x1="120" y1="360" x2="120" y2="390"/>

    <!-- Process Box 4 -->
    <rect class="box" x="20" y="390" width="200" height="40"/>
    <text class="box-text" x="120" y="415">Identify Important Features</text>

    <!-- Arrow 5 -->
    <line class="line" x1="120" y1="430" x2="120" y2="515"/>

    <!-- Parallelogram OUTPUT -->
    <polygon class="box" points="20,515 250,515 230,595 0,595"/>
    <text class="box-text-bold" x="125" y="540">OUTPUT: Loan Risk Score,</text>
    <text class="box-text-bold" x="125" y="555">SHAP Importance,</text>
    <text class="box-text-bold" x="125" y="570">Explainable AI Report</text>

    <!-- Connector to Column 4 -->
    <path class="line" d="M 230 555 L 290 555 L 290 95 L 310 95"/>
  </g>

  <!-- ==================== COLUMN 4: LAYER 4 ==================== -->
  <g transform="translate(870, 30)">
    <!-- Header Badge -->
    <rect class="title-badge" x="0" y="0" width="260" height="35"/>
    <text class="badge-text" x="130" y="22">Layer 4: Policy RAG &amp; Chatbot Engine</text>

    <!-- Top Parallelogram -->
    <polygon class="box" points="20,65 250,65 230,145 0,145"/>
    <text class="box-text" x="125" y="90">Output of Layer 3 &amp; Pre-</text>
    <text class="box-text" x="125" y="105">Loaded Bank Policy PDFs</text>
    <text class="box-text" x="125" y="120">(knowledge_base/)</text>

    <!-- Arrow 1 -->
    <line class="line" x1="125" y1="145" x2="125" y2="175"/>

    <!-- Process Box 1 -->
    <rect class="box" x="25" y="175" width="200" height="40"/>
    <text class="box-text" x="125" y="200">PolicyAgent</text>

    <!-- Arrow 2 -->
    <line class="line" x1="125" y1="215" x2="125" y2="245"/>

    <!-- Process Box 2 -->
    <rect class="box" x="15" y="245" width="220" height="50"/>
    <text class="box-text" x="125" y="267">Text Chunking &amp; Embeddings</text>
    <text class="box-text" x="125" y="282">(all-MiniLM-L6-v2)</text>

    <!-- Arrow 3 -->
    <line class="line" x1="125" y1="295" x2="125" y2="325"/>

    <!-- Process Box 3 -->
    <rect class="box" x="20" y="325" width="210" height="45"/>
    <text class="box-text" x="125" y="345">FAISS Vector Database</text>
    <text class="box-text" x="125" y="360">(faiss_index/)</text>

    <!-- Arrow 4 -->
    <line class="line" x1="125" y1="370" x2="125" y2="400"/>

    <!-- Process Box 4 -->
    <rect class="box" x="25" y="400" width="200" height="40"/>
    <text class="box-text" x="125" y="425">Interactive RAG Policy Chatbot</text>

    <!-- Arrow 5 -->
    <line class="line" x1="125" y1="440" x2="125" y2="515"/>

    <!-- Parallelogram OUTPUT -->
    <polygon class="box" points="20,515 250,515 230,625 0,625"/>
    <text class="box-text-bold" x="125" y="540">OUTPUT: Final Customer Dashboard</text>
    <text class="box-text-bold" x="125" y="555">(Approved/Rejected Status,</text>
    <text class="box-text-bold" x="125" y="570">SHAP Reason Charts, Cited</text>
    <text class="box-text-bold" x="125" y="585">Policy Rules &amp; Chatbot)</text>

    <!-- Connector to Column 5 -->
    <path class="line" d="M 230 570 L 290 570 L 290 95 L 310 95"/>
  </g>

  <!-- ==================== COLUMN 5: LAYER 5 (NEWLY ADDED) ==================== -->
  <g transform="translate(1170, 30)">
    <!-- Header Badge -->
    <rect class="title-badge" x="0" y="0" width="280" height="35"/>
    <text class="badge-text" x="140" y="22">Layer 5: Decision Orchestration &amp; Dashboard UI Layer</text>

    <!-- Top Parallelogram -->
    <polygon class="box" points="20,65 260,65 240,145 0,145"/>
    <text class="box-text" x="130" y="95">Output of Layer 4 &amp;</text>
    <text class="box-text" x="130" y="115">Underwriting Rationale</text>

    <!-- Arrow 1 -->
    <line class="line" x1="130" y1="145" x2="130" y2="175"/>

    <!-- Process Box 1 -->
    <rect class="box" x="20" y="175" width="220" height="40"/>
    <text class="box-text" x="130" y="200">RecommendationAgent</text>

    <!-- Arrow 2 -->
    <line class="line" x1="130" y1="215" x2="130" y2="245"/>

    <!-- Process Box 2 -->
    <rect class="box" x="10" y="245" width="240" height="45"/>
    <text class="box-text" x="130" y="265">Generate Actionable</text>
    <text class="box-text" x="130" y="280">Credit Score Fixes</text>

    <!-- Arrow 3 -->
    <line class="line" x1="130" y1="290" x2="130" y2="325"/>

    <!-- Process Box 3 -->
    <rect class="box" x="10" y="325" width="240" height="45"/>
    <text class="box-text" x="130" y="345">Bank Audit Checklist &amp;</text>
    <text class="box-text" x="130" y="360">Compliance Logging</text>

    <!-- Arrow 4 -->
    <line class="line" x1="130" y1="370" x2="130" y2="400"/>

    <!-- Process Box 4 -->
    <rect class="box" x="20" y="400" width="220" height="40"/>
    <text class="box-text" x="130" y="425">Interactive Underwriting Web UI</text>

    <!-- Arrow 5 -->
    <line class="line" x1="130" y1="440" x2="130" y2="515"/>

    <!-- Parallelogram OUTPUT -->
    <polygon class="box" points="15,515 275,515 255,645 0,645"/>
    <text class="box-text-bold" x="135" y="535">OUTPUT: Final Customer Dashboard</text>
    <text class="box-text-bold" x="135" y="550">(Approved/Rejected Status,</text>
    <text class="box-text-bold" x="135" y="565">SHAP Reason Charts, Cited Policy</text>
    <text class="box-text-bold" x="135" y="580">Rules &amp; Interactive Chatbot,</text>
    <text class="box-text-bold" x="135" y="595">Instant Sanction Letter PDF)</text>
  </g>

</svg>
</div>
</body>
</html>
