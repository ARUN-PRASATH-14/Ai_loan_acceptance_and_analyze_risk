# Build: Install Node deps, build frontend, then install Python deps
# Start: Run Flask with gunicorn

services:
  - type: web
    name: loan-iq
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && npm install && npm run build"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: 20.18.0
      - key: GROQ_API_KEY
        sync: false
